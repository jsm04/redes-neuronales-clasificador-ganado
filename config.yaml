# ============================================
# CONFIGURACIÓN PRINCIPAL DEL PROYECTO
# ============================================

project:
  name: "redes-neuronales"
  description: "Proyecto universitario de redes neuronales"
  # Tipos soportados: image_classification, text_sentiment, time_series, voice_recognition
  problem_type: "image_classification"   # ← CAMBIAR SEGÚN EL PROBLEMA ELEGIDO

# ============================================
# DATASETS
# ============================================
data:
  raw_dir: "data/raw/"
  preprocessed_dir: "data/preprocessed/"
  
  # Opciones de división
  train_split: 0.7
  validation_split: 0.15

# ============================================
# MODELO — Arquitectura
# ============================================
model:
  # Opciones: cnn, simple_cnn, lstm
  architecture: "cnn"
  
  # Parámetros generales del modelo
  input_shape: [224, 224, 3]             # Para imágenes: alto, ancho, canales
  num_classes: 2                          # Cambiar según el problema (2 = binario)
  
  # LSTM
    units: 128
    return_sequences: false
    
  # Regularización
  regularization:
    dropout_rate: 0.5
    l2_regularization: 0.01
    
# ============================================
# ENTRENAMIENTO — Hiperparámetros
# ============================================
training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  optimizer: "adam"                       # adam, sgd, rmsprop
  
  # Callbacks
  early_stopping:
    enabled: true
    patience: 10                          # Épocas sin mejora antes de detenerse
    monitor: "val_loss"                   # Métrica a monitorear
    
  checkpointing:
    enabled: true
    filepath: "models/best_model.keras"   # Guardar mejor modelo
  
# (no evaluation section — evaluate.py uses defaults)
  
# ============================================
# ENTORNO DE EJECUCIÓN
# ============================================
environment:
  output_dir: "output/"
  

