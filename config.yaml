# ============================================
# CONFIGURACIÓN PRINCIPAL
# ============================================

project:
  name: "redes-neuronales"
  description: "Clasificación de imágenes de ganado"
  problem_type: "image_classification"


# ============================================
# DATASET
# ============================================

data:
  raw_dir: "data/raw/"

  # Tamaño de lote utilizado por tf.data
  batch_size: 32

  # División del dataset
  train_split: 0.70
  validation_split: 0.15
  test_split: 0.15

  # Semilla para obtener divisiones reproducibles
  random_seed: 42

  # Aumento de datos aplicado únicamente al entrenamiento
  augmentation:
    enabled: true
    horizontal_flip: true
    rotation: 10
    zoom: 0.10
    contrast: 0.10


# ============================================
# MODELO
# ============================================

model:
  # CNN para clasificación de imágenes
  architecture: "cnn"

  # Alto, ancho, canales
  input_shape: [224, 224, 3]

  # Se actualizará automáticamente según las
  # clases encontradas en data/raw/
  num_classes: 2

  regularization:
    dropout_rate: 0.5
    l2_regularization: 0.0


# ============================================
# ENTRENAMIENTO
# ============================================

training:
  epochs: 50
  learning_rate: 0.001
  optimizer: "adam"

  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 10

  checkpointing:
    enabled: true
    filepath: "output/best_model.pt"
    monitor: "val_loss"

  reduce_lr:
    enabled: true
    monitor: "val_loss"
    factor: 0.5
    patience: 4
    min_lr: 0.00001


# ============================================
# ENTORNO
# ============================================

environment:
  output_dir: "output/"


