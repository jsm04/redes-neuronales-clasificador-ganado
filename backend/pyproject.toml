[project]
name = "cattle-api"
version = "0.1.0"
description = "API de inferencia para la clasificación de razas bovinas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26,<2.0",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "torch>=2.4",
    "torchvision>=0.19",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
