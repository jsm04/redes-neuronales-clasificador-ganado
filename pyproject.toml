[project]
name = "redes-neuronales"
version = "0.1.0"
description = "Cattle image classification using a convolutional neural network"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.26,<2.0",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "torch==2.12.0",
    "torchvision==0.27.0",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest>=7.4",
    "ruff>=0.17.1",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportArgumentType = "none"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
