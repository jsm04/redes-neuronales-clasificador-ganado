[project]
name = "redes-neuronales"
version = "0.1.0"
description = "Cattle image classification using a convolutional neural network"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.26,<2.0",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "torch==2.12.0",
    "torchvision==0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
